<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#162733"
  >

  <title>ClimaView AR</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script
    src="script.js"
    defer
  ></script>
</head>


<body
  data-year="current"
  data-risk-level="2"
>

  <main
    class="viewport"
    aria-label="ClimaView 기후위기 AR 시뮬레이션"
  >

    <div
      class="scene"
      id="scene"
    >

      <!-- =================================================
           카메라 배경
      ================================================== -->
      <div class="background-layer">

        <video
          id="camera-feed"
          class="camera-feed"
          autoplay
          muted
          playsinline
        ></video>

      </div>


      <button
        id="camera-start-button"
        class="camera-start-button glass"
        type="button"
        hidden
      >
        카메라 시작
      </button>


      <!-- =================================================
           GUI
      ================================================== -->
      <div class="gui-layer">


        <!-- 상단 연도 -->
        <nav
          class="timeline glass"
          aria-label="시뮬레이션 연도"
        >

          <button
            class="year selected"
            type="button"
            data-year="current"
            aria-pressed="true"
          >
            현재
          </button>

          <button
            class="year"
            type="button"
            data-year="2030"
            aria-pressed="false"
          >
            2030년
          </button>

          <button
            class="year"
            type="button"
            data-year="2050"
            aria-pressed="false"
          >
            2050년
          </button>

          <button
            class="year"
            type="button"
            data-year="2090"
            aria-pressed="false"
          >
            2090년
          </button>

        </nav>


        <!-- =================================================
             왼쪽 패널
        ================================================== -->
        <aside
          class="left-panel"
          aria-label="기후 시뮬레이션 메뉴"
        >


          <!-- 기후 시뮬레이션 -->
          <div class="menu-group">

            <button
              class="menu glass"
              type="button"
              aria-expanded="false"
              aria-controls="climate-menu"
            >

              <span>
                기후 시뮬레이션
              </span>

              <span
                class="chevron"
                aria-hidden="true"
              ></span>

            </button>


            <div
              class="submenu glass"
              id="climate-menu"
              aria-hidden="true"
            >

              <div class="submenu-divider"></div>


              <!-- 폭염 -->
              <button
                class="submenu-item climate-option active"
                type="button"
                data-risk="heatwave"
              >

                <img
                  class="climate-menu-icon"
                  src="./heatwave.svg"
                  alt=""
                >

                <span>폭염</span>

              </button>


              <!-- 침수 -->
              <button
                class="submenu-item climate-option"
                type="button"
                data-risk="flood"
              >

                <img
                  class="climate-menu-icon"
                  src="./sealevel.svg"
                  alt=""
                >

                <span>침수</span>

              </button>


              <!-- 열대야 -->
              <button
                class="submenu-item climate-option"
                type="button"
                data-risk="tropical"
              >

                <img
                  class="climate-menu-icon"
                  src="./tropical.svg"
                  alt=""
                >

                <span>열대야</span>

              </button>


              <!-- 산불 -->
              <button
                class="submenu-item climate-option"
                type="button"
                data-risk="wildfire"
              >

                <img
                  class="climate-menu-icon"
                  src="./forest%20fires.svg"
                  alt=""
                >

                <span>산불</span>

              </button>


              <!-- 대기질 -->
              <button
                class="submenu-item climate-option"
                type="button"
                data-risk="air"
              >

                <img
                  class="climate-menu-icon"
                  src="./air%20quality.svg"
                  alt=""
                >

                <span>대기질</span>

              </button>

            </div>

          </div>


          <!-- 대응 요소 -->
          <div class="menu-group">

            <button
              class="menu response-menu glass"
              type="button"
              aria-expanded="false"
              aria-controls="response-menu"
            >

              <span>
                대응 요소 배치
              </span>

              <span
                class="chevron"
                aria-hidden="true"
              ></span>

            </button>


            <div
              class="submenu glass"
              id="response-menu"
              aria-hidden="true"
            >

              <div class="submenu-divider"></div>


              <button
                class="submenu-item"
                type="button"
              >

                <img
                  class="response-menu-icon"
                  src="./tree.svg"
                  alt=""
                >

                <span>가로수</span>

              </button>


              <button
                class="submenu-item"
                type="button"
              >

                <img
                  class="response-menu-icon"
                  src="./shade.svg"
                  alt=""
                >

                <span>그늘막</span>

              </button>


              <button
                class="submenu-item"
                type="button"
              >

                <img
                  class="response-menu-icon"
                  src="./pavement.svg"
                  alt=""
                >

                <span>투수포장</span>

              </button>

            </div>

          </div>


          <!-- 현재 위치 지도 -->
          <section
            class="map-card glass"
            id="map-card"
            aria-label="현재 위치 지도"
          >

            <div
              id="location-map"
              class="location-map"
              aria-label="GPS 기반 현재 위치 지도"
            ></div>


            <div class="map-card-footer">

              <span
                class="map-location-name"
                id="map-location-name"
              >
                위치 확인 중
              </span>

              <span
                class="map-location-status"
                id="map-location-status"
                aria-live="polite"
              >
                GPS 연결 중...
              </span>

            </div>

          </section>

        </aside>


        <!-- =================================================
             오른쪽 정보 카드
        ================================================== -->
        <section
          class="info-card glass"
          id="info-card"
        >

          <header class="card-header">

            <h1 id="info-title">
              현재 위치의 기후위험
            </h1>

            <span class="scenario">
              SSP5 - 8.5
            </span>

          </header>


          <!-- 대표 위험 -->
          <div class="risk-summary">

            <p
              class="risk-name"
              id="risk-name"
            >
              폭염
            </p>


            <div class="risk-value-row">

              <span
                class="risk-value"
                id="risk-value"
              >
                31.2
              </span>

              <span
                class="risk-unit"
                id="risk-unit"
              >
                °C
              </span>

            </div>

          </div>


          <p
            class="risk-caption"
            id="risk-caption"
          >
            현재 위치의 예상 최고 체감온도
          </p>


          <!-- 그래프 -->
          <div class="chart-section">

            <h2>
              지역 기후위험 변화 추이
            </h2>


            <svg
              class="chart"
              viewBox="0 0 336 168"
              role="img"
              aria-label="지역 기후위험 변화 추이"
            >

              <defs>

                <linearGradient
                  id="chart-fill"
                  x1="0"
                  y1="0"
                  x2="1"
                  y2="0"
                >

                  <stop
                    offset="0"
                    stop-color="#4ca8ce"
                    stop-opacity=".30"
                  />

                  <stop
                    offset=".62"
                    stop-color="#62c7ed"
                    stop-opacity=".72"
                  />

                  <stop
                    offset="1"
                    stop-color="#ef7769"
                    stop-opacity=".90"
                  />

                </linearGradient>


                <linearGradient
                  id="risk-gradient"
                  gradientUnits="userSpaceOnUse"
                  x1="50"
                  y1="0"
                  x2="150"
                  y2="0"
                >

                  <stop
                    offset="0"
                    stop-color="#ef6d5f"
                    stop-opacity="0"
                  />

                  <stop
                    offset=".50"
                    stop-color="#ef6d5f"
                    stop-opacity=".82"
                  />

                  <stop
                    offset="1"
                    stop-color="#ef6d5f"
                    stop-opacity="0"
                  />

                </linearGradient>

              </defs>


              <!-- Y축 -->
              <g class="axis-label risk-axis-label">

                <text x="0" y="28">
                  매우 높음
                </text>

                <text x="0" y="60">
                  높음
                </text>

                <text x="0" y="92">
                  보통
                </text>

                <text x="0" y="124">
                  낮음
                </text>

              </g>


              <!-- 축 -->
              <path
                d="M70 14v108h234"
                fill="none"
                stroke="rgba(255,255,255,.72)"
                stroke-width="1"
              />


              <!-- 그래프 면 -->
              <path
                id="chart-area"
                class="chart-area"
                d="
                  M70 112
                  L130 102
                  L205 82
                  L275 48
                  L304 40
                  L304 122
                  L70 122
                  Z
                "
                fill="url(#chart-fill)"
              />


              <!-- 위험 강조 -->
              <path
                id="chart-risk-area"
                class="chart-risk-area"
                d="
                  M70 112
                  L130 102
                  L205 82
                  L275 48
                  L304 40
                  L304 122
                  L70 122
                  Z
                "
                fill="url(#risk-gradient)"
              />


              <!-- 연도 포인트 -->
              <g class="chart-anchor-points">

                <circle
                  id="chart-point-current"
                  cx="70"
                  cy="112"
                  r="5"
                />

                <circle
                  id="chart-point-2030"
                  cx="130"
                  cy="102"
                  r="5"
                />

                <circle
                  id="chart-point-2050"
                  cx="205"
                  cy="82"
                  r="5"
                />

                <circle
                  id="chart-point-2090"
                  cx="275"
                  cy="48"
                  r="5"
                />

              </g>


              <!-- 선택 포인트 -->
              <circle
                id="chart-selected-point"
                class="chart-selected-point"
                cx="70"
                cy="112"
                r="6"
              />


              <!-- 위험 라벨 -->
              <g
                class="chart-value-label"
                id="chart-value-label"
              >

                <rect
                  x="-28"
                  y="-29"
                  width="56"
                  height="26"
                  rx="13"
                />

                <text
                  id="chart-value-text"
                  x="0"
                  y="-11"
                  text-anchor="middle"
                >
                  보통
                </text>

              </g>


              <!-- X축 -->
              <g
                class="axis-label"
                text-anchor="middle"
              >

                <text x="70" y="151">
                  현재
                </text>

                <text x="130" y="151">
                  2030
                </text>

                <text x="205" y="151">
                  2050
                </text>

                <text x="275" y="151">
                  2090
                </text>

              </g>

            </svg>

          </div>


          <!-- =================================================
               하단 정보
          ================================================== -->
          <dl class="metrics">


            <div class="metric">

              <img
                id="metric-one-icon"
                class="metric-icon"
                src="./icon_feels_temp.svg"
                alt=""
                aria-hidden="true"
              >

              <dt id="metric-one-label">
                체감온도
              </dt>

              <dd id="metric-one-value">
                31.2°C
              </dd>

            </div>


            <div class="metric">

              <img
                id="metric-two-icon"
                class="metric-icon"
                src="./icon_tropical_night.svg"
                alt=""
                aria-hidden="true"
              >

              <dt id="metric-two-label">
                추가 위험
              </dt>

              <dd id="metric-two-value">
                열대야
              </dd>

            </div>


            <div class="metric">

              <img
                id="warning-area-icon"
                class="metric-icon"
                src="./icon_warning_area.svg"
                alt=""
                aria-hidden="true"
              >

              <dt>
                주의 환경
              </dt>

              <dd id="warning-area">
                그늘이 적은 보행 공간
              </dd>

            </div>

          </dl>

        </section>

      </div>


      <!-- =================================================
           위험 경고 팝업
      ================================================== -->
      <div
        id="danger-alert"
        class="danger-alert"
        aria-hidden="true"
      >

        <div class="danger-alert-backdrop"></div>


        <div class="danger-alert-content">

          <img
            class="danger-alert-icon-image"
            src="./icon_warning_area.svg"
            alt=""
          >


          <h2>
            ATTENTION!
          </h2>


          <p
            id="danger-alert-message"
            class="danger-alert-message"
          >
            2090년, 위험 단계가 크게 상승합니다.<br>
            이후 화면에서는 현재 공간 위에 예상 기후위험과<br>
            위험 정보가 강조되어 표시됩니다.
          </p>


          <button
            id="danger-alert-confirm"
            class="danger-alert-confirm"
            type="button"
          >

            <span id="danger-alert-button-text">
              2090년 시뮬레이션 보기
            </span>

            <span aria-hidden="true">
              →
            </span>

          </button>

        </div>

      </div>

    </div>

  </main>

</body>

</html>
